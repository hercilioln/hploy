# Example app: an nginx and a throwaway postgres, both official images.
#
#   cd example && hploy plan
version: 1
app: example

domains:
  - example.localhost

# The service that receives traffic. Only this one has a port.
web:
  image: nginx:1.29-alpine
  port: 80
  health: /                      # shorthand, same as { path: / }
  env:
    literal:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
  resources:
    memory: 64m
    cpus: "0.25"

# Support service: no port, internal network only.
services:
  db:
    image: postgres:17-alpine
    env:
      required: [POSTGRES_PASSWORD]
      literal:
        POSTGRES_DB: example
        POSTGRES_USER: example
    volumes:
      - data:/var/lib/postgresql/data
    health:
      cmd: ["pg_isready", "-U", "example"]
      interval: 5s
      retries: 10
    resources:
      memory: 128m

volumes:
  data: {}
